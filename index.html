<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Evidence docházky</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#EEF0F4" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF0F4;
    --surface: #FFFFFF;
    --surface-alt: #F5F6F9;
    --border: #DDE1E8;
    --text: #171A21;
    --text-muted: #6B7280;
    --accent: #A6841F;
    --accent-bg: rgba(166,132,31,0.10);
    --pos: #2E8574;
    --neg: #BB4430;
    --pos-bg: rgba(46,133,116,0.12);
    --neg-bg: rgba(187,68,48,0.12);
  }
  body.dark {
    --bg: #12151C;
    --surface: #1B2029;
    --surface-alt: #171B23;
    --border: #2A3140;
    --text: #E8E6DE;
    --text-muted: #7C8494;
    --accent: #C9A227;
    --accent-bg: rgba(201,162,39,0.16);
    --pos: #4FA692;
    --neg: #D46A54;
    --pos-bg: rgba(79,166,146,0.16);
    --neg-bg: rgba(212,106,84,0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-bottom: 40px;
    min-height: 100vh;
    transition: background .2s, color .2s;
  }
  .serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
  input[type="time"], input[type="number"], input[type="date"] { color-scheme: light; }
  body.dark input[type="time"], body.dark input[type="number"], body.dark input[type="date"] { color-scheme: dark; }
  button { font-family: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }
  .header { padding: 24px 16px 14px; max-width: 520px; margin: 0 auto; display:flex; align-items:flex-start; justify-content:space-between; }
  .eyebrow { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  .monthrow { display: flex; align-items: center; gap: 4px; }
  .navbtn { background: none; border: none; color: var(--text); padding: 6px; cursor: pointer; font-size:16px; }
  .monthlabel { font-size: 22px; font-weight: 600; min-width: 150px; text-align:center; }
  .headerbtns { display:flex; gap:8px; }
  .iconbtn { background: var(--surface); border: 1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius: 10px; cursor:pointer; font-size:15px; margin-top:2px; display:flex; align-items:center; justify-content:center; }

  .summary { background: var(--surface); border-radius: 14px; padding: 16px 18px; border: 1px solid var(--border); margin-bottom: 14px; }
  .summary-row { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  .summary .total { font-size: 26px; font-weight: 700; color: var(--accent); }
  .summary .label { font-size: 11px; color: var(--text-muted); text-transform:uppercase; letter-spacing: 0.5px; }
  .summary .saldo-val { font-size: 20px; font-weight:700; }
  .quota-row { display:flex; gap: 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap:wrap; }
  .quota-item { font-size: 12px; color:var(--text-muted); }
  .quota-item b { color:var(--text); font-size:13px; }

  .add-row { margin-bottom: 12px; }

  .table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table.dtable { width:100%; table-layout: fixed; border-collapse: collapse; font-size: 11px; }
  .dtable th { text-align:left; color:var(--text-muted); font-weight:500; font-size:9px; text-transform:uppercase; letter-spacing:0.3px; padding: 7px 3px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); background:var(--surface-alt); overflow:hidden; text-overflow:ellipsis; }
  .dtable th:last-child { border-right:none; }
  .dtable td { padding: 6px 3px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); cursor:pointer; overflow:hidden; text-overflow:ellipsis; }
  .dtable td:last-child { border-right:none; }
  .dtable td.nowrap { white-space:nowrap; }
  .dtable th.ctr, .dtable td.ctr { text-align:center; }
  .dtable tr.row-alt td { background: var(--surface-alt); }
  .dtable tr.row-alt.today td { background: var(--accent-bg); }
  .work-val { font-weight:600; }
  .saldo-chip { display:inline-block; padding: 2px 9px; border-radius: 20px; font-weight:600; font-size:11px; }
  .week-row td { padding: 6px 8px 6px 14px; background: var(--surface-alt); border-right:none; border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); cursor:default; position:relative; }
  .week-row td::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent); }
  .week-row .wk-label { font-family:'Fraunces', serif; font-size: 12px; font-weight:600; letter-spacing:0.2px; color: var(--text); }
  .week-row .wk-stats { float:right; font-size: 10px; }
  .week-row .wk-stats span { margin-left: 8px; }
  .datecell { border-left: 3px solid transparent; padding-left: 5px; margin-left: -5px; }
  .dtable tr:last-child td { border-bottom:none; }
  .dtable tr.weekend td { color:var(--text-muted); }
  .dtable tr.today td { background: var(--accent-bg); }
  .dtable tr:hover td { filter: brightness(0.97); }
  body.dark .dtable tr:hover td { filter: brightness(1.08); }
  .datecell { display:flex; flex-direction:column; line-height:1.2; }
  .datecell .num { font-size:13px; }
  .datecell .wd { font-size:10px; color:var(--text-muted); text-transform:uppercase; }
  .cell-dash { color:var(--text-muted); opacity:.5; }
  .saldo-pos { color:var(--pos); }
  .saldo-neg { color:var(--neg); }
  .saldo-zero { color:var(--text-muted); }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:11px; }
  .empty-state { text-align:center; padding: 28px 12px; color:var(--text-muted); font-size:13px; }

  .status { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 12px; height: 16px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0;
    padding: 20px 20px 28px; border: 1px solid var(--border); border-bottom: none;
    max-height: 85vh; overflow-y:auto;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sheet-title { font-size: 20px; font-weight: 600; }
  .closebtn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; }

  .status-line { display:flex; justify-content:space-between; align-items:center; padding: 10px 0; font-size:14px; }
  .status-line .lbl { color:var(--text-muted); font-size:12px; }
  .divider { border-top:1px solid var(--border); margin: 10px 0; }

  .primary-btn {
    width:100%; padding: 12px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent-bg); color:var(--accent); font-size:14px; cursor:pointer; margin-top: 8px; font-weight:600;
  }
  .choice-list { display:flex; flex-direction:column; gap:6px; margin-top: 10px; }
  .choice-btn {
    display:flex; align-items:center; gap:10px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background:var(--surface-alt); color:var(--text); font-size:14px; cursor:pointer; text-align:left;
  }
  .choice-btn .em { font-size:16px; }
  .linkbtn { background:none; border:none; color:var(--text-muted); font-size:13px; cursor:pointer; padding:0; margin-top: 10px; }
  .linkbtn.danger { color:var(--neg); }

  .timefield label, .field label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; }
  .timefield input, .field input {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 16px; margin-bottom: 12px;
  }
  .btnrow { display:flex; gap:10px; }
  .btnrow button { flex:1; padding: 11px; border-radius:9px; font-size:14px; cursor:pointer; }
  .btn-cancel { background:none; border:1px solid var(--border); color:var(--text-muted); }
  .btn-save { background:var(--accent); border:1px solid var(--accent); color:#12151C; font-weight:600; }

  .field { margin-bottom: 16px; }
  .field input[type="number"] {
    width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 15px;
  }
  .switch-row { display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; }
  .switch { position:relative; width:44px; height:26px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--border); border-radius:20px; cursor:pointer; transition:.2s; }
  .slider:before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:var(--text-muted); border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background: var(--accent-bg); }
  .switch input:checked + .slider:before { transform: translateX(18px); background:var(--accent); }

  .login-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-box { width:100%; max-width: 360px; background: var(--surface); border:1px solid var(--border); border-radius:16px; padding: 28px 24px; }
  .login-title { font-size: 22px; font-weight:600; margin-bottom: 18px; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="eyebrow">Evidence docházky</div>
    <div class="login-title serif">Přihlášení</div>
    <div class="field">
      <label>Uživatelské jméno</label>
      <input type="text" id="loginUser" autocomplete="username" />
    </div>
    <div class="field">
      <label>Heslo</label>
      <div style="position:relative;">
        <input type="password" id="loginPass" autocomplete="current-password" style="padding-right:44px;" />
        <button type="button" id="togglePass" aria-label="Zobrazit heslo"
          style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; padding:6px; display:flex; align-items:center;">
          <svg id="eyeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.5 12s3.9-7 10.5-7 10.5 7 10.5 7-3.9 7-10.5 7S1.5 12 1.5 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="switch-row" style="margin-bottom:6px;">
      <label style="font-size:14px;">Zapamatovat si mě</label>
      <label class="switch">
        <input type="checkbox" id="loginRemember" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div id="loginError" style="color:var(--neg);font-size:13px;min-height:18px;margin-bottom:6px;"></div>
    <button class="primary-btn" id="loginBtn" style="margin-top:0;">Přihlásit se</button>
  </div>
</div>

<div class="header">
  <div>
    <div class="eyebrow">Evidence docházky</div>
    <div class="monthrow">
      <button class="navbtn" id="prevMonth" aria-label="Předchozí měsíc">&#8592;</button>
      <div class="monthlabel serif" id="monthLabel"></div>
      <button class="navbtn" id="nextMonth" aria-label="Další měsíc">&#8594;</button>
    </div>
  </div>
  <div class="headerbtns">
    <button class="iconbtn" id="themeToggle" aria-label="Přepnout téma">🌙</button>
    <button class="iconbtn" id="openSettings" aria-label="Nastavení">&#9881;</button>
    <button class="iconbtn" id="logoutBtn" aria-label="Odhlásit se">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</div>

<div class="wrap">
  <div class="summary">
    <div class="summary-row">
      <div>
        <div class="label">Odpracováno</div>
        <div class="total mono" id="totalHours"></div>
      </div>
      <div style="text-align:right;">
        <div class="label">Saldo</div>
        <div class="saldo-val mono" id="totalSaldo"></div>
      </div>
    </div>
    <div class="quota-row">
      <div class="quota-item">Dovolená: <b id="vacLeft"></b></div>
      <div class="quota-item">Sickdays: <b id="sickLeft"></b></div>
    </div>
  </div>

  <div class="add-row">
    <button class="primary-btn" id="addDayBtn" style="margin-top:0;">+ Přidat den</button>
  </div>

  <div class="table-wrap">
    <table class="dtable">
      <colgroup>
        <col style="width:20%"><col style="width:20%"><col style="width:20%"><col style="width:20%"><col style="width:20%">
      </colgroup>
      <thead>
        <tr>
          <th>Den</th>
          <th class="ctr">Přích.</th>
          <th class="ctr">Odch.</th>
          <th class="ctr">Odprac.</th>
          <th class="ctr">Saldo</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="status" id="status"></div>

<!-- Day sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title serif" id="sheetTitle"></div>
      <button class="closebtn" id="closeSheet">&#10005;</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- Settings sheet -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title serif">Nastavení</div>
      <button class="closebtn" id="closeSettings">&#10005;</button>
    </div>
    <div class="field">
      <label>Dovolená (dní / rok)</label>
      <input type="number" id="setVacation" min="0" step="1" />
    </div>
    <div class="field">
      <label>Sickdays (dní / rok)</label>
      <input type="number" id="setSickdays" min="0" step="1" />
    </div>
    <div class="field">
      <label>Délka pracovního dne bez přestávky (h)</label>
      <input type="number" id="setWorkLen" min="0" step="0.5" />
    </div>
    <div class="switch-row">
      <label style="font-size:14px;">Započítávat zákonnou přestávku</label>
      <label class="switch">
        <input type="checkbox" id="setCountBreak" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="field">
      <label>Délka přestávky (min)</label>
      <input type="number" id="setBreakMin" min="0" step="5" />
    </div>
    <button class="primary-btn" id="saveSettings">Uložit nastavení</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
