<!DOCTYPE html>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        /* Neutrální paleta pro celou aplikaci */
                        primary: { 50: '#f8fafc', 100: '#f1f5f9', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                    }
                }
            }
        }
    </script>
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background-color: #f1f5f9; color: #334155; } /* Světle šedé neutrální pozadí */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Animace pro okna */
        .sheet-enter { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sheet-enter-active { transform: translateY(0); }
        .overlay-enter { opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .overlay-enter-active { opacity: 1; pointer-events: auto; }
        
        /* Čistá tabulka inspirovaná screenshotem */
        .classic-table th, .classic-table td {
            border: 1px solid #cbd5e1; /* slate-300 */

        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            border-radius: 4px;
            margin-right: 2px;
            opacity: 0.6;

    </style>
</head>
<body class="antialiased min-h-screen pb-24">

            </div>
            <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">Vítej zpět, Lucko!</h2>
            <p class="text-slate-500 text-center text-sm mb-8">Moje Docházka</p>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Uživatelské jméno</label>
                    <input type="text" id="loginUser" autocomplete="username" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary-500 transition" placeholder="Zadej jméno" />

        <!-- Plovoucí tlačítko přidat (+) - ŽLUTÉ JAKO NA OBRÁZKU -->

    <!-- OVERLAY PRO DETAIL DNE (Neutrální styl) -->

        <div class="absolute inset-0 bg-slate-900/40" id="overlayBackdrop"></div>

                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Kvóty (dní za rok)</h4>
                    
                    <div class="flex items-center justify-between">

                        <input type="number" id="setVacation" min="0" step="1" class="w-20 text-center bg-white border border-slate-300 rounded-md py-1.5 font-mono text-slate-800 focus:outline-none focus:border-primary-500" />

                    <div>

                        <input type="number" id="setWorkLen" min="0" step="0.5" class="w-full bg-white border border-slate-300 rounded-md px-3 py-2 font-mono text-slate-800 focus:outline-none focus:border-primary-500" />
                    </div>
                    
                    <div class="flex items-center justify-between pt-3 border-t border-slate-200">

                            <label class="font-semibold text-sm block text-slate-700">Zákonná přestávka</label>

                        </div>

                            <div class="w-10 h-5 bg-slate-300 rounded-full peer-checked:bg-primary-500 transition-colors border border-slate-400 peer-checked:border-primary-600"></div>

                        <input type="number" id="setBreakMin" min="0" step="5" class="w-full bg-white border border-slate-300 rounded-md px-3 py-2 font-mono text-slate-800 focus:outline-none focus:border-primary-500" />
                    </div>
                </div>
                
                <button id="saveSettings" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg py-3.5 transition shadow-sm mt-4 active:scale-[0.98]">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        const AUTH_USER = 'lucka';
        const AUTH_PASS = 'Emicka2020';

        function isAuthed() {
            return localStorage.getItem('dochazka_auth') === '1' || sessionStorage.getItem('dochazka_auth') === '1';
        }
        
        const loginOverlay = document.getElementById('loginOverlay');
        function showApp() { 
            loginOverlay.style.opacity = '0';
            setTimeout(() => { loginOverlay.style.display = 'none'; }, 300);
        }
        
        if (isAuthed()) {
            loginOverlay.style.display = 'none';
        }

        document.getElementById('togglePass').addEventListener('click', () => {
            const input = document.getElementById('loginPass');
            const icon = document.getElementById('eyeIcon');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'ph ph-eye-slash text-xl' : 'ph ph-eye text-xl';
        });

        function attemptLogin() {
            const u = document.getElementById('loginUser').value.trim().toLowerCase();
            const p = document.getElementById('loginPass').value;
            if (u === AUTH_USER && p === AUTH_PASS) {
                if (document.getElementById('loginRemember').checked) localStorage.setItem('dochazka_auth', '1');
                else sessionStorage.setItem('dochazka_auth', '1');
                document.getElementById('loginError').textContent = '';
                showApp();
            } else {
                document.getElementById('loginError').textContent = 'Špatné jméno nebo heslo.';
            }
        }
        
        document.getElementById('loginBtn').addEventListener('click', attemptLogin);
        document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('dochazka_auth');
            sessionStorage.removeItem('dochazka_auth');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            loginOverlay.style.display = 'flex';
            setTimeout(() => { loginOverlay.style.opacity = '1'; }, 10);
        });

        const firebaseConfig = {
            apiKey: "AIzaSyCXeJSAeej49YIODneqfTuI9eT4u9QlmN0",
            authDomain: "evidence-dochazky.firebaseapp.com",
            projectId: "evidence-dochazky",
            storageBucket: "evidence-dochazky.firebasestorage.app",
            messagingSenderId: "698522546437",
            appId: "1:698522546437:web:93b605318baf8a0b7ec76c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const docRef = db.collection('dochazka').doc('entries');

        const TYPES = {
            sickday:   { label: 'Sickday',          icon: 'ph-first-aid',       colorCls: 'text-orange-600', bgCls: 'bg-orange-50' },
            dovolena:  { label: 'Dovolená',         icon: 'ph-airplane-tilt',   colorCls: 'text-blue-600',   bgCls: 'bg-blue-50' },
            neplacene: { label: 'Nepl. volno',      icon: 'ph-moon',            colorCls: 'text-purple-600', bgCls: 'bg-purple-50' },
            doktor:    { label: 'Doktor',           icon: 'ph-stethoscope',     colorCls: 'text-teal-600',   bgCls: 'bg-teal-50' },
            svatek:    { label: 'Svátek',           icon: 'ph-flag-banner',     colorCls: 'text-rose-600',   bgCls: 'bg-rose-50' },
        };

        const MONTHS = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
        const WEEKDAYS_SHORT = ['Po','Út','St','Čt','Pá','So','Ne'];

        let year = new Date().getFullYear();
        let month = new Date().getMonth();
        let entries = {};
        let settings = { vacationDaysTotal: 20, sickDaysTotal: 5, workDayLength: 8, countBreak: true, breakMinutes: 30 };
        
        let openDayKey = null;
        let sheetStep = 'view'; 
        let pendingAction = null; 

        function pad(n) { return String(n).padStart(2, '0'); }
        function isoDate(y, m, d) { return year + '-' + pad(m + 1) + '-' + pad(d); }
        function weekdayIdxFromKey(key) {
            const parts = key.split('-');
            const wd = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])).getDay();
            return wd === 0 ? 6 : wd - 1;
        }
        function todayISO() {
            const t = new Date();
            return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
        }
        function isoWeek(key) {
            const parts = key.split('-');
            const date = new Date(Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])));
            const dayNum = (date.getUTCDay() + 6) % 7;
            date.setUTCDate(date.getUTCDate() - dayNum + 3);
            const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
            const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
            firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
            return 1 + Math.round((date - firstThursday) / (7 * 86400000));
        }
        function spanMinutes(inT, outT) {
            const inParts = inT.split(':');
            const outParts = outT.split(':');
            let mins = (Number(outParts[0]) * 60 + Number(outParts[1])) - (Number(inParts[0]) * 60 + Number(inParts[1]));
            if (mins < 0) mins += 24 * 60;
            return mins;
        }
        
        function fmtDur(hoursFloat) {
            const totalMin = Math.round(Math.abs(hoursFloat) * 60);
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return h + ':' + pad(m);
        }
        function workedHours(entry) {
            if (!entry || entry.type !== 'work' || !entry.checkIn || !entry.checkOut) return null;
            let mins = spanMinutes(entry.checkIn, entry.checkOut);
            if (settings.countBreak) mins -= (Number(settings.breakMinutes) || 0);
            if (mins < 0) mins = 0;
            return mins / 60;
        }
        function daySaldo(entry) {
            const wh = workedHours(entry);
            if (wh === null) return null;
            return wh - Number(settings.workDayLength);
        }

        function setStatus(text) { 
            const st = document.getElementById('status');
            st.textContent = text;
            if(text) {
                st.classList.add('text-primary-500');
                st.classList.remove('text-slate-400');
            } else {
                st.classList.remove('text-primary-500');
                st.classList.add('text-slate-400');
            }
        }

        docRef.onSnapshot(snap => {
            if (snap.exists) {
                try {
                    const data = JSON.parse(snap.data().json || '{}');
                    entries = data.entries || {};
                    settings = Object.assign({}, settings, data.settings || {});
                } catch (e) { entries = {}; }
            }
            render();
            if (openDayKey || sheetStep === 'pickdate') renderSheet();
        }, err => {
            setStatus('Chyba spojení');
            console.error(err);
        });

        async function persist() {
            setStatus('Ukládám...');
            try {
                await docRef.set({ json: JSON.stringify({ entries, settings }), updatedAt: Date.now() });
                setStatus('Uloženo ✓');
                setTimeout(() => setStatus(''), 2000);
            } catch (e) {
                setStatus('Chyba ukládání!');
                console.error(e);
            }
        }

        function setEntry(dateKey, patch) {
            if (patch === null) delete entries[dateKey];
            else entries[dateKey] = patch;
            persist();
            render();
        }

        function render() {
            document.getElementById('monthLabel').textContent = MONTHS[month] + ' ' + year;

            const prefix = year + '-' + pad(month + 1) + '-';
            const monthKeys = Object.keys(entries).filter(k => k.startsWith(prefix)).sort();

            let totalHours = 0, totalSaldo = 0;
            let vacUsed = 0, sickUsed = 0;

            monthKeys.forEach(key => {
                const e = entries[key];
                const wh = workedHours(e);
                if (wh !== null) { totalHours += wh; totalSaldo += daySaldo(e); }
            });
            
            Object.keys(entries).forEach(key => {
                if (!key.startsWith(String(year) + '-')) return;
                const t = entries[key].type;
                if (t === 'dovolena') vacUsed++;
                if (t === 'sickday') sickUsed++;
            });

            // Aktualizace neutrální karty souhrnu
            document.getElementById('totalHours').textContent = fmtDur(totalHours);
            const saldoEl = document.getElementById('totalSaldo');
            
            let saldoStr = '0:00';
            if (totalSaldo < -0.0001) saldoStr = '−' + fmtDur(Math.abs(totalSaldo));
            else if (totalSaldo > 0.0001) saldoStr = '+' + fmtDur(totalSaldo);
            
            saldoEl.textContent = saldoStr;
            
            if (totalSaldo > 0.0001) {
                saldoEl.className = 'text-xs font-bold font-mono text-[#008f11]';
            } else if (totalSaldo < -0.0001) {
                saldoEl.className = 'text-xs font-bold font-mono text-[#d32f2f]';
            } else {
                saldoEl.className = 'text-xs font-bold font-mono text-slate-800';
            }

            document.getElementById('vacLeft').textContent = Math.max(0, settings.vacationDaysTotal - vacUsed);
            document.getElementById('sickLeft').textContent = Math.max(0, settings.sickDaysTotal - sickUsed);

            const container = document.getElementById('weeksContainer');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            if (monthKeys.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }
            emptyState.style.display = 'none';

            const todayKey = todayISO();
            const weeks = [];
            
            monthKeys.forEach(key => {
                const wk = isoWeek(key);
                let group = weeks.find(g => g.wk === wk);
                if (!group) { group = { wk, keys: [] }; weeks.push(group); }
                group.keys.push(key);
            });

            // Striktní, extrémně zmenšená tabulka (jako na screenshotu)
            let html = '';
            html += '<div class="bg-white rounded-md shadow-sm border border-slate-300 overflow-x-auto">';
            html += '<table class="classic-table w-full text-left border-collapse min-w-[340px] bg-white whitespace-nowrap">';
            html += '<thead>';
            html += '<tr class="text-[9px] text-slate-600 uppercase tracking-wide bg-slate-50">';
            
            // Základní třída pro hlavičku
            const thClass = "font-bold py-1 px-1.5 text-center";
            
            html += '<th class="' + thClass + ' text-left w-16">Datum</th>';
            html += '<th class="' + thClass + ' w-12">Typ</th>';
            html += '<th class="' + thClass + ' w-12">Příchod</th>';
            html += '<th class="' + thClass + ' w-12">Odchod</th>';
            html += '<th class="' + thClass + ' w-12">Hod</th>';
            html += '<th class="' + thClass + ' w-14">Saldo</th>';
            html += '</tr>';
            html += '</thead>';
            html += '<tbody>';

            weeks.forEach(group => {
                // Oddělovač týdne
                html += '<tr>';
                html += '<td colspan="6" class="py-0.5 px-1.5 text-[9px] text-slate-500 bg-slate-100">Týden ' + group.wk + '</td>';
                html += '</tr>';

                group.keys.forEach(key => {
                    const parts = key.split('-');
                    const d = Number(parts[2]);
                    const m = Number(parts[1]);
                    const wIdx = weekdayIdxFromKey(key);
                    const isWeekend = wIdx >= 5;
                    const e = entries[key];
                    const isToday = key === todayKey;
                    
                    let rowClass = "hover:bg-slate-50 cursor-pointer " + (isToday ? 'bg-blue-50/30' : 'bg-white');
                    let dateClass = isToday ? 'text-blue-700 font-bold' : (isWeekend ? 'text-slate-400' : 'text-slate-800');
                    let dateStr = d + '.' + m + '. ' + WEEKDAYS_SHORT[wIdx];

                    html += '<tr class="' + rowClass + '" onclick="openSheet(\'' + key + '\')">';
                    
                    // Ultra zmenšené vnitřní okraje buněk
                    const tdClass = "py-1 px-1.5 text-center text-[11px] align-middle text-slate-700";

                    html += '<td class="' + tdClass.replace('text-center', 'text-left') + ' ' + dateClass + '">' + dateStr + '</td>';

                    if (e && e.type && e.type !== 'work') {
                        const cat = TYPES[e.type];
                        html += '<td class="' + tdClass + ' font-medium ' + cat.colorCls + '">' + cat.label + '</td>';
                        html += '<td class="' + tdClass + ' text-slate-300">-</td>';
                        html += '<td class="' + tdClass + ' text-slate-300">-</td>';
                        html += '<td class="' + tdClass + ' text-slate-300">-</td>';
                        html += '<td class="' + tdClass + ' text-slate-300">-</td>';
                    } else {
                        html += '<td class="' + tdClass + ' text-slate-600">Práce</td>';
                        html += '<td class="' + tdClass + ' font-mono">' + (e.checkIn || '-') + '</td>';
                        html += '<td class="' + tdClass + ' font-mono">' + (e.checkOut || '-') + '</td>';
                        
                        const wh = workedHours(e);
                        const sal = daySaldo(e);
                        
                        if (wh !== null) {
                            html += '<td class="' + tdClass + ' font-mono text-slate-800">' + fmtDur(wh) + '</td>';
                            
                            let sStr = '0:00';
                            let tdExtra = 'font-mono text-slate-500'; // Nula = šedý text bez pozadí
                            
                            if (sal < -0.0001) {
                                sStr = '−' + fmtDur(Math.abs(sal));
                                // Plné ostré červené pozadí
                                tdExtra = 'bg-[#d32f2f] text-white font-bold font-mono';
                            } else if (sal > 0.0001) {
                                sStr = '+' + fmtDur(sal);
                                // Plné ostré zelené pozadí (přesně jako na Androidu)
                                tdExtra = 'bg-[#008f11] text-white font-bold font-mono';
                            }

                            // Aplikace barvy přímo na TD aby vyplnila celou buňku bez okrajů
                            html += '<td class="py-1 px-1.5 text-center text-[11px] align-middle ' + tdExtra + '">' + sStr + '</td>';
                        } else {
                            html += '<td class="' + tdClass + ' text-slate-300">-</td>';
                            html += '<td class="' + tdClass + ' text-slate-300">-</td>';
                        }
                    }
                    html += '</tr>';
                });
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function toggleOverlay(id, show) {
            const wrap = document.getElementById(id);
            if (show) {
                wrap.classList.remove('hidden');
                setTimeout(() => {
                    wrap.classList.add('overlay-enter-active');
                    wrap.querySelector('.sheet-enter').classList.add('sheet-enter-active');
                }, 10);
            } else {
                wrap.classList.remove('overlay-enter-active');
                wrap.querySelector('.sheet-enter').classList.remove('sheet-enter-active');
                setTimeout(() => { wrap.classList.add('hidden'); }, 300);
            }
        }

        function openSheet(key) {
            openDayKey = key;
            sheetStep = 'view';
            toggleOverlay('overlay', true);
            renderSheet();
        }
        
        function openAddSheet() {
            openDayKey = null;
            sheetStep = 'pickdate';
            toggleOverlay('overlay', true);
            renderSheet();
        }
        
        function closeSheet() {
            openDayKey = null;
            sheetStep = 'view';
            toggleOverlay('overlay', false);
        }

        function renderSheet() {
            const body = document.getElementById('sheetBody');
            const title = document.getElementById('sheetTitle');

            if (sheetStep === 'pickdate') {
                title.innerHTML = 'Přidat nový den';
                
                let html = '<div class="mb-5">';
                html += '<label class="block text-sm font-semibold text-slate-600 mb-1.5">Vyber datum</label>';
                html += '<input type="date" id="pickDateInput" value="' + todayISO() + '" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 text-base font-mono focus:outline-none focus:border-primary-500 transition" />';
                html += '</div>';
                html += '<button id="pickDateGo" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg py-3.5 transition shadow-sm">Pokračovat</button>';
                
                body.innerHTML = html;
                
                document.getElementById('pickDateGo').addEventListener('click', () => {
                    const val = document.getElementById('pickDateInput').value;
                    if (!val) return;
                    openDayKey = val;
                    sheetStep = entries[val] ? 'view' : 'choose';
                    renderSheet();
                });
                return;
            }

            const parts = openDayKey.split('-');
            const y = Number(parts[0]);
            const m = Number(parts[1]);
            const d = Number(parts[2]);
            const weekdayNames = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
            
            title.innerHTML = d + '. ' + MONTHS[m-1] + ' <span class="text-slate-400 font-normal text-sm ml-2">' + weekdayNames[new Date(y, m - 1, d).getDay()] + '</span>';

            const entry = entries[openDayKey];

            if (sheetStep === 'time') {
                const isCheckIn = pendingAction === 'checkIn';
                const existing = entry && entry[pendingAction];
                const now = new Date();
                const defaultVal = existing || (pad(now.getHours()) + ':' + pad(now.getMinutes()));
                
                let html = '<div class="mb-6">';
                html += '<label class="block text-sm font-semibold text-slate-600 mb-1.5">' + (isCheckIn ? 'Čas příchodu' : 'Čas odchodu') + '</label>';
                html += '<input type="time" id="timeInput" value="' + defaultVal + '" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-xl text-center font-mono focus:outline-none focus:border-primary-500 transition" />';
                html += '</div>';
                html += '<div class="flex gap-2">';
                html += '<button id="cancelTime" class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-lg py-3 transition">Zrušit</button>';
                html += '<button id="saveTime" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg py-3 transition shadow-sm">Uložit čas</button>';
                html += '</div>';
                
                body.innerHTML = html;
                
                document.getElementById('cancelTime').addEventListener('click', () => { sheetStep = 'choose'; renderSheet(); });
                document.getElementById('saveTime').addEventListener('click', () => {
                    const val = document.getElementById('timeInput').value;
                    if (!val) return;
                    const next = Object.assign({}, entry && entry.type === 'work' ? entry : {}, { type: 'work' });
                    next[pendingAction] = val;
                    setEntry(openDayKey, next);
                    sheetStep = 'view';
                    renderSheet();
                });
                return;
            }

            if (sheetStep === 'choose') {
                let html = '<div class="space-y-3 mb-5">';
                html += '<div class="grid grid-cols-2 gap-2 mb-4">';
                html += '<button class="choice-btn flex flex-col items-center justify-center p-3 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 rounded-lg transition" data-action="checkIn"><i class="ph ph-arrow-circle-right text-2xl mb-1 text-slate-400"></i><span class="font-semibold text-xs">Zadat příchod</span></button>';
                html += '<button class="choice-btn flex flex-col items-center justify-center p-3 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 rounded-lg transition" data-action="checkOut"><i class="ph ph-arrow-circle-left text-2xl mb-1 text-slate-400"></i><span class="font-semibold text-xs">Zadat odchod</span></button>';
                html += '</div>';
                html += '<p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Ostatní záznamy</p>';

                ['sickday', 'dovolena', 'neplacene', 'doktor', 'svatek'].forEach(key => {
                    const t = TYPES[key];
                    html += '<button class="choice-btn w-full flex items-center justify-between p-3 bg-white border border-slate-300 rounded-lg hover:border-slate-400 transition group" data-type="' + key + '">';
                    html += '<div class="flex items-center gap-3">';
                    html += '<div class="w-8 h-8 rounded-md flex items-center justify-center ' + t.bgCls + ' ' + t.colorCls + '"><i class="ph ' + t.icon + ' text-base"></i></div>';
                    html += '<span class="font-semibold text-sm text-slate-700">' + t.label + '</span>';
                    html += '</div>';
                    html += '<i class="ph ph-caret-right text-slate-300 group-hover:text-slate-500"></i>';
                    html += '</button>';
                });
                
                html += '</div>';
                html += '<button id="backToView" class="w-full text-slate-500 font-semibold py-2 hover:text-slate-800 transition text-sm">Zpět</button>';
                
                body.innerHTML = html;

                body.querySelectorAll('[data-action]').forEach(btn => {
                    btn.addEventListener('click', () => { pendingAction = btn.dataset.action; sheetStep = 'time'; renderSheet(); });
                });
                body.querySelectorAll('[data-type]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        setEntry(openDayKey, { type: btn.dataset.type });
                        sheetStep = 'view';
                        renderSheet();
                    });
                });
                document.getElementById('backToView').addEventListener('click', () => {
                    sheetStep = entries[openDayKey] ? 'view' : 'pickdate';
                    renderSheet();
                });
                return;
            }

            // View mode
            let html = '';
            if (entry && entry.type && entry.type !== 'work') {
                const cat = TYPES[entry.type];
                html += '<div class="flex flex-col items-center justify-center py-6">';
                html += '<div class="w-16 h-16 rounded-full flex items-center justify-center mb-3 ' + cat.bgCls + ' ' + cat.colorCls + '"><i class="ph ' + cat.icon + ' text-3xl"></i></div>';
                html += '<h4 class="text-lg font-bold text-slate-800">' + cat.label + '</h4>';
                html += '</div>';
            } else if (entry) {
                const wh = workedHours(entry);
                const sal = daySaldo(entry);
                
                html += '<div class="bg-slate-50 rounded-lg border border-slate-300 p-4 mb-5">';
                html += '<div class="flex justify-between items-center mb-3"><span class="text-sm font-semibold text-slate-500">Příchod</span><span class="text-base font-bold font-mono text-slate-800">' + (entry.checkIn || '–') + '</span></div>';
                html += '<div class="flex justify-between items-center pb-3 border-b border-slate-200"><span class="text-sm font-semibold text-slate-500">Odchod</span><span class="text-base font-bold font-mono text-slate-800">' + (entry.checkOut || '–') + '</span></div>';
                
                if (wh !== null) {
                    let sStr = '0:00';
                    let sCls = 'text-slate-600 bg-transparent';
                    
                    // Styl salda i v detailu
                    if (sal < -0.0001) { 
                        sStr = '−' + fmtDur(Math.abs(sal)); 
                        sCls = 'bg-[#d32f2f] text-white px-2 py-0.5 rounded'; 
                    } else if (sal > 0.0001) { 
                        sStr = '+' + fmtDur(sal); 
                        sCls = 'bg-[#008f11] text-white px-2 py-0.5 rounded'; 
                    }

                    html += '<div class="flex justify-between items-center mt-3"><span class="text-sm font-semibold text-slate-500">Odpracováno</span><span class="text-base font-bold font-mono text-slate-800">' + fmtDur(wh) + '</span></div>';
                    html += '<div class="flex justify-between items-center mt-2"><span class="text-sm font-semibold text-slate-500">Saldo</span><span class="text-sm font-bold font-mono ' + sCls + '">' + sStr + '</span></div>';
                }
                html += '</div>';
            } else {
                html += '<div class="py-8 text-center">';
                html += '<i class="ph ph-ghost text-3xl text-slate-300 mb-2"></i>';
                html += '<p class="text-sm text-slate-500">Žádný záznam pro tento den</p>';
                html += '</div>';
            }
            
            html += '<div class="space-y-2 mt-2">';
            html += '<button id="addBtn" class="w-full bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-bold rounded-lg py-3 transition flex justify-center items-center gap-2"><i class="ph ph-pencil-simple text-base"></i> Upravit / Přidat záznam</button>';
            
            if (entry) {
                html += '<button id="clearBtn" class="w-full bg-white text-red-600 hover:bg-red-50 font-bold rounded-lg py-2.5 transition mt-1 flex justify-center items-center gap-2 border border-slate-200"><i class="ph ph-trash text-base"></i> Smazat záznam</button>';
            }
            html += '</div>';
            
            body.innerHTML = html;

            document.getElementById('addBtn').addEventListener('click', () => { sheetStep = 'choose'; renderSheet(); });
            const clearBtn = document.getElementById('clearBtn');
            if (clearBtn) clearBtn.addEventListener('click', () => { setEntry(openDayKey, null); closeSheet(); });
        }

        function openSettings() {
            document.getElementById('setVacation').value = settings.vacationDaysTotal;
            document.getElementById('setSickdays').value = settings.sickDaysTotal;
            document.getElementById('setWorkLen').value = settings.workDayLength;
            document.getElementById('setCountBreak').checked = !!settings.countBreak;
            document.getElementById('setBreakMin').value = settings.breakMinutes;
            toggleOverlay('settingsOverlay', true);
        }
        
        function closeSettings() { 
            toggleOverlay('settingsOverlay', false); 
        }

        document.getElementById('openSettings').addEventListener('click', openSettings);
        document.getElementById('closeSettings').addEventListener('click', closeSettings);
        document.getElementById('settingsBackdrop').addEventListener('click', closeSettings);
        document.getElementById('overlayBackdrop').addEventListener('click', closeSheet);
        
        document.getElementById('saveSettings').addEventListener('click', () => {
            settings = {
                vacationDaysTotal: Number(document.getElementById('setVacation').value) || 0,
                sickDaysTotal: Number(document.getElementById('setSickdays').value) || 0,
                workDayLength: Number(document.getElementById('setWorkLen').value) || 8,
                countBreak: document.getElementById('setCountBreak').checked,
                breakMinutes: Number(document.getElementById('setBreakMin').value) || 0,
            };
            persist();
            render();
            closeSettings();
        });

        document.getElementById('prevMonth').addEventListener('click', () => {
            month -= 1; if (month < 0) { month = 11; year -= 1; } render();
        });
        document.getElementById('nextMonth').addEventListener('click', () => {
            month += 1; if (month > 11) { month = 0; year += 1; } render();
        });
        
        document.getElementById('addDayBtn').addEventListener('click', openAddSheet);

        render();

    </script>
</body>
</html>
